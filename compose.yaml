services:
  marketd:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:5556-5559:5556-5559"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./configs/docker.json:/app/configs/local.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
