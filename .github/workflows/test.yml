name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev pkg-config
      - if: runner.os == 'macOS'
        run: brew install zeromq pkg-config
      - run: python -m pip install -r examples/requirements.txt
      - run: go test -race ./...
        env:
          PYTHON: python
      - run: go vet ./...
      - run: go build ./cmd/marketd ./cmd/subscriber
